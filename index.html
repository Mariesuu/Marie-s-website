<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mi Corazón — 西语自主学习（DELE备考）</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="brand">
      <div class="logo">💖</div>
      <div>
        <h1>Mi Corazón</h1>
        <p>Barbie 梦幻风 · DELE 备考浓缩</p>
      </div>
    </div>
    <nav class="nav">
      <button data-module="listening" class="nav-btn active">听力</button>
      <button data-module="speaking" class="nav-btn">口语</button>
      <button data-module="reading" class="nav-btn">阅读</button>
      <button data-module="writing" class="nav-btn">写作</button>
      <button id="ai-chat-toggle" class="nav-btn">AI 对话</button>
    </nav>
  </header>

  <main class="container">
    <section id="module-area" class="module-area">
      <!-- Modules will be injected here -->
    </section>

    <aside class="sidebar">
        <div class="profile card">
          <h3>当前级别</h3>
          <p>A2 → 目标 B1</p>
          <div id="progress">进度：0%</div>
        </div>
        <div class="card">
          <h3>选择级别</h3>
          <select id="level-select" style="width:100%;padding:8px;border-radius:8px;border:1px solid #f0dbe3">
            <option value="A2">A2</option>
            <option value="B1">B1</option>
            <option value="B2">B2</option>
            <option value="C1">C1</option>
          </select>
        </div>
        <div class="quiz card">
          <h3>练习得分</h3>
          <div id="score">0</div>
        </div>
    </aside>
  </main>

  <div id="ai-chat" class="ai-chat hidden">
    <div class="chat-window">
      <div id="messages" class="messages"></div>
      <div class="chat-controls">
        <input id="chat-input" placeholder="用西班牙语与 AI 对话，或写下练习题目..." />
        <button id="send-chat">发送</button>
      </div>
    </div>
    <button id="close-chat" class="close-chat">关闭</button>
  </div>

  <script src="assets/js/app.js"></script>
</body>
</html>
